name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (all, user-service, order-service)'
        required: false
        default: 'all'
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/**'
      - '.github/workflows/build-image.yml'
      - '.github/actions/build-and-push-image/**'

env:
  AWS_REGION: us-east-1

jobs:
  determine-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine services to build
        id: set-services
        run: |
          if [ "${{ github.event.inputs.service }}" == "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            echo "services=[\"user-service\",\"order-service\"]" >> $GITHUB_OUTPUT
          else
            echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
          fi

  build-images:
    needs: determine-services
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services) }}
    steps:
      - name: Build and push image
        uses: ./.github/actions/build-and-push-image
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          service-name: ${{ matrix.service }}
          dockerfile-path: ./services/${{ matrix.service }}
          image-tag: ${{ github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          environment-tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  summary:
    needs: build-images
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "✅ Image build workflow completed"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Services built: ${{ needs.determine-services.outputs.services }}"
