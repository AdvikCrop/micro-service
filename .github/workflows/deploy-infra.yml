name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform (plan, apply)'
        required: false
        type: choice
        options:
          - plan
          - apply
        default: plan

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            ACTION="${{ github.event.inputs.action }}"
          else
            ENV="dev"
            ACTION="plan"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT

      - name: Deploy infrastructure
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ steps.env.outputs.environment }}
          terraform-dir: 'terraform/environments'
          tfvars-file: 'terraform/environments/${{ steps.env.outputs.environment }}/terraform.tfvars'
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          state-key: 'microservices/${{ steps.env.outputs.environment }}/terraform.tfstate'
          action: ${{ steps.env.outputs.action }}

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.env.outputs.action == 'plan'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Infrastructure Plan\n\n✅ Terraform plan completed. Review the plan artifact for changes.'
            })

      - name: Create deployment summary
        if: always()
        run: |
          echo "## Infrastructure Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: ${{ steps.env.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts**: Check artifacts for terraform plan and outputs" >> $GITHUB_STEP_SUMMARY
