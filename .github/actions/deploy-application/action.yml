name: 'Deploy Application with Helm'
description: 'Deploy microservices to EKS cluster using Helm'

inputs:
  aws-account-id:
    description: 'AWS Account ID'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
    default: 'us-east-1'
  cluster-name:
    description: 'EKS cluster name'
    required: true
  environment:
    description: 'Environment (dev, prod)'
    required: true
  helm-chart-path:
    description: 'Path to Helm chart'
    required: false
    default: './helm'
  helm-release-name:
    description: 'Helm release name'
    required: false
    default: 'microservices-app'
  helm-namespace:
    description: 'Kubernetes namespace'
    required: false
    default: 'default'
  helm-values-file:
    description: 'Path to values file (e.g., helm/values-dev.yaml)'
    required: true
  user-service-image-tag:
    description: 'User service image tag'
    required: true
  order-service-image-tag:
    description: 'Order service image tag'
    required: true
  aws-role-to-assume:
    description: 'AWS IAM role to assume for OIDC'
    required: true
  helm-timeout:
    description: 'Helm operation timeout'
    required: false
    default: '10m'
  wait-for-rollout:
    description: 'Wait for rollout to complete'
    required: false
    default: 'true'

outputs:
  deployment-status:
    description: 'Deployment status'
    value: ${{ steps.deploy.outputs.status }}
  helm-release-version:
    description: 'Helm release version'
    value: ${{ steps.deploy.outputs.release-version }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Update kubeconfig
      shell: bash
      run: |
        echo "Updating kubeconfig for cluster: ${{ inputs.cluster-name }}"
        aws eks update-kubeconfig \
          --name ${{ inputs.cluster-name }} \
          --region ${{ inputs.aws-region }}

        echo "✅ Kubeconfig updated"
        echo ""
        echo "Cluster Info:"
        kubectl cluster-info
        echo ""
        echo "Nodes:"
        kubectl get nodes

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Create namespace
      shell: bash
      run: |
        echo "Creating namespace: ${{ inputs.helm-namespace }}"
        kubectl create namespace ${{ inputs.helm-namespace }} --dry-run=client -o yaml | kubectl apply -f -
        echo "✅ Namespace ready"

    - name: Verify database credentials secret
      shell: bash
      run: |
        echo "Checking database credentials secret..."
        if kubectl get secret db-credentials -n ${{ inputs.helm-namespace }} &> /dev/null; then
          echo "✅ Database credentials secret found"
        else
          echo "⚠️  Database credentials secret not found"
          echo "Please create it with: kubectl create secret generic db-credentials --from-literal=password=YOUR_PASSWORD"
        fi

    - name: Validate Helm chart
      shell: bash
      run: |
        echo "Validating Helm chart..."
        helm lint ${{ inputs.helm-chart-path }}
        echo "✅ Helm chart validation passed"

    - name: Add Helm repositories
      shell: bash
      run: |
        echo "Adding required Helm repositories..."
        helm repo add eks https://aws.github.io/eks-charts || true
        helm repo update
        echo "✅ Helm repositories updated"

    - name: Dry-run Helm deployment
      shell: bash
      run: |
        echo "Performing Helm dry-run..."
        helm upgrade --install ${{ inputs.helm-release-name }} ${{ inputs.helm-chart-path }} \
          --namespace ${{ inputs.helm-namespace }} \
          --values ${{ inputs.helm-values-file }} \
          --set image.registry=${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com \
          --set image.user_service.tag=${{ inputs.user-service-image-tag }} \
          --set image.order_service.tag=${{ inputs.order-service-image-tag }} \
          --timeout ${{ inputs.helm-timeout }} \
          --dry-run \
          --debug > /tmp/helm-dry-run.yaml

        echo "✅ Helm dry-run successful"
        echo ""
        echo "Resources to be deployed:"
        grep "^kind:" /tmp/helm-dry-run.yaml | sort | uniq -c

    - name: Deploy with Helm
      id: deploy
      shell: bash
      run: |
        echo "Deploying with Helm..."
        helm upgrade --install ${{ inputs.helm-release-name }} ${{ inputs.helm-chart-path }} \
          --namespace ${{ inputs.helm-namespace }} \
          --values ${{ inputs.helm-values-file }} \
          --set image.registry=${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com \
          --set image.user_service.tag=${{ inputs.user-service-image-tag }} \
          --set image.order_service.tag=${{ inputs.order-service-image-tag }} \
          --timeout ${{ inputs.helm-timeout }} \
          --wait

        RELEASE_VERSION=$(helm list -n ${{ inputs.helm-namespace }} -o json | \
          jq -r '.[] | select(.name=="${{ inputs.helm-release-name }}") | .revision')

        echo "✅ Helm deployment completed"
        echo "status=success" >> $GITHUB_OUTPUT
        echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

    - name: Wait for rollout
      if: inputs.wait-for-rollout == 'true'
      shell: bash
      run: |
        echo "Waiting for deployment rollout..."
        echo ""

        # Wait for user-service deployment
        echo "Waiting for user-service deployment..."
        kubectl rollout status deployment/microservices-app-user-service \
          -n ${{ inputs.helm-namespace }} \
          --timeout=5m || EXIT_CODE=$?

        if [ "${EXIT_CODE:-0}" -eq 0 ]; then
          echo "✅ User-service deployment successful"
        else
          echo "⚠️  User-service deployment status check completed"
        fi

        echo ""

        # Wait for order-service deployment
        echo "Waiting for order-service deployment..."
        kubectl rollout status deployment/microservices-app-order-service \
          -n ${{ inputs.helm-namespace }} \
          --timeout=5m || EXIT_CODE=$?

        if [ "${EXIT_CODE:-0}" -eq 0 ]; then
          echo "✅ Order-service deployment successful"
        else
          echo "⚠️  Order-service deployment status check completed"
        fi

    - name: Check deployment status
      shell: bash
      run: |
        echo "📋 Deployment Status:"
        echo ""
        echo "Helm Release:"
        helm status ${{ inputs.helm-release-name }} -n ${{ inputs.helm-namespace }}
        echo ""
        echo "Pods:"
        kubectl get pods -n ${{ inputs.helm-namespace }} -l app.kubernetes.io/instance=${{ inputs.helm-release-name }}
        echo ""
        echo "Services:"
        kubectl get svc -n ${{ inputs.helm-namespace }} -l app.kubernetes.io/instance=${{ inputs.helm-release-name }}
        echo ""
        echo "Ingress:"
        kubectl get ingress -n ${{ inputs.helm-namespace }}

    - name: Get pod logs on failure
      if: failure()
      shell: bash
      continue-on-error: true
      run: |
        echo "❌ Deployment failed. Retrieving pod logs..."
        echo ""

        PODS=$(kubectl get pods -n ${{ inputs.helm-namespace }} -l app.kubernetes.io/instance=${{ inputs.helm-release-name }} -o name)

        for POD in $PODS; do
          echo "Logs for $POD:"
          kubectl logs $POD -n ${{ inputs.helm-namespace }} --tail=50 || true
          echo ""
        done

        echo "Deployment events:"
        kubectl get events -n ${{ inputs.helm-namespace }} --sort-by='.lastTimestamp' || true

    - name: Upload deployment manifest
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: helm-manifest-${{ inputs.environment }}
        path: /tmp/helm-dry-run.yaml
        retention-days: 7

    - name: Summary
      if: always()
      shell: bash
      run: |
        echo "🎯 Deployment Summary:"
        echo "  Environment: ${{ inputs.environment }}"
        echo "  Cluster: ${{ inputs.cluster-name }}"
        echo "  Release: ${{ inputs.helm-release-name }}"
        echo "  Namespace: ${{ inputs.helm-namespace }}"
        echo "  User Service Tag: ${{ inputs.user-service-image-tag }}"
        echo "  Order Service Tag: ${{ inputs.order-service-image-tag }}"
        echo "  Release Version: ${{ steps.deploy.outputs.release-version }}"
        echo ""
        echo "✅ Deployment action completed"
