replicaCount: 1

environment: dev
aws_region: us-east-1

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

database:
  host: postgres-dev.c9akciq32.ng.0001.use1.cache.amazonaws.com
  port: 5432
  user: postgres

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    acm-ssl: "false"
  hosts:
    - host: api-dev.example.com
      paths:
        - path: /
          pathType: Prefix
